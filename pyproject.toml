# Pyproject minimal — ZORAN's Jobs.
# Pas de packaging : le projet n'est pas distribué via PyPI.
# Sert uniquement à configurer ruff de manière reproductible.

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "tests/reconstruction",  # reconstruit dynamiquement, pas à linter
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line-length déjà géré par `line-length`
    "E402",   # imports après sys.path manipulation — voulu dans les tests
    "B007",   # unused loop variable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts utilisés dans les tests
